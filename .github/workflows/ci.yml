name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run python -m pytest tests/ -q --tb=short

  dotnet:
    name: C# Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        working-directory: addin/APBridgeAddIn
        run: dotnet build APBridgeAddIn.csproj --nologo -v:q 2>&1 | Select-String -Pattern "error|Build succeeded|Build FAILED"
        shell: pwsh
