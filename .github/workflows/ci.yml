name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run python -m pytest tests/ -q --tb=short

  dotnet:
    name: C# Build
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check ArcGIS SDK availability
        id: check_sdk
        shell: pwsh
        run: |
          $sdkPaths = @(
            "C:\Program Files\ArcGIS\Pro\bin\ArcGIS.Core.Host.dll",
            "C:\Program Files\ArcGIS\Pro\bin\ArcGIS.Desktop.Framework.dll"
          )
          $available = $true
          foreach ($p in $sdkPaths) {
            if (-not (Test-Path $p)) { $available = $false; break }
          }
          if ($available) {
            echo "sdk_available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            echo "sdk_available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Build
        if: steps.check_sdk.outputs.sdk_available == 'true'
        working-directory: addin/APBridgeAddIn
        run: dotnet build APBridgeAddIn.csproj --nologo -v:q 2>&1 | Select-String -Pattern "error|Build succeeded|Build FAILED"
        shell: pwsh

      - name: Skip build
        if: steps.check_sdk.outputs.sdk_available != 'true'
        shell: pwsh
        run: echo "::warning::ArcGIS Pro SDK not available on this runner. Skipping C# build."
