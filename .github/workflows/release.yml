name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check ArcGIS SDK availability
        id: check_sdk
        shell: pwsh
        run: |
          $sdkPaths = @(
            "C:\Program Files\ArcGIS\Pro\bin\ArcGIS.Core.Host.dll",
            "C:\Program Files\ArcGIS\Pro\bin\ArcGIS.Desktop.Framework.dll"
          )
          $available = $true
          foreach ($p in $sdkPaths) {
            if (-not (Test-Path $p)) { $available = $false; break }
          }
          echo "sdk_available=$available" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Add-In
        if: steps.check_sdk.outputs.sdk_available == 'true'
        working-directory: addin/APBridgeAddIn
        run: dotnet build APBridgeAddIn.csproj --nologo -v:q 2>&1 | Select-String -Pattern "error|Build succeeded|Build FAILED"
        shell: pwsh

      - name: Package Add-In (via package-addin.ps1)
        if: steps.check_sdk.outputs.sdk_available == 'true'
        working-directory: addin/APBridgeAddIn
        run: ./package-addin.ps1 -Action package
        shell: pwsh

      - name: Skip Add-In build
        if: steps.check_sdk.outputs.sdk_available != 'true'
        shell: pwsh
        run: echo "::warning::ArcGIS Pro SDK not available on this runner. Skipping Add-In build."

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            addin/APBridgeAddIn/bin/Debug/net8.0-windows8.0/APBridgeAddIn.esriAddinX
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
